services:
  db:
    image: postgres:16-alpine
    container_name: shopacc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopacc
      POSTGRES_PASSWORD: shopacc
      POSTGRES_DB: shopacc
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
